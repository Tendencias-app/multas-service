apiVersion: v1
kind: ConfigMap
metadata:
  name: ms-multas-config
data:
  KAFKA_ENABLED: "true"
  KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
  LOG_LEVEL: "INFO"
  PORCENTAJE_MULTA_RETRASO_DIA: "0.10"
  PORCENTAJE_MULTA_DANOS: "0.30"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-multas
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-multas
  template:
    metadata:
      labels:
        app: ms-multas
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: ms-multas
          image: joricor/multas-service:1.0.3
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8085
          securityContext:
            allowPrivilegeEscalation: false
          envFrom:
            - configMapRef:
                name: ms-multas-config
          env:
            - name: DB_USER
              valueFrom:
                secretKeyRef: { name: multas-db, key: POSTGRES_USER }
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: multas-db, key: POSTGRES_PASSWORD }
            - name: DATABASE_URL
              value: "postgresql+psycopg://$(DB_USER):$(DB_PASSWORD)@postgres:5432/multas_db"
          readinessProbe:
            httpGet: { path: /health, port: 8085 }
            initialDelaySeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: 8085 }
            initialDelaySeconds: 20
          resources:
            requests: { cpu: "100m", memory: "128Mi" }
            limits: { cpu: "500m", memory: "256Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: ms-multas
spec:
  selector:
    app: ms-multas
  ports:
    - port: 8085
      targetPort: 8085