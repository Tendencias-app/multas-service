services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: multas
      POSTGRES_PASSWORD: multas
      POSTGRES_DB: multas_db
    volumes:
      - multas_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U multas -d multas_db"]
      interval: 5s
      timeout: 3s
      retries: 10

  multas:
    image: joricor/multas-service:latest
    ports:
      - "8085:8085"
    environment:
      DATABASE_URL: postgresql+psycopg://multas:multas@postgres:5432/multas_db
      KAFKA_ENABLED: "true"
      KAFKA_BOOTSTRAP_SERVERS: ${COMPOSE_KAFKA_SERVERS:-kafka:29092}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  kafka:
    profiles: ["local-kafka"]
    image: apache/kafka:3.7.0
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,HOST://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

volumes:
  multas_pgdata: